name: Publish public site

on:
  push:
    branches: [main]
    paths:
      - .nojekyll
      - index.html
      - privacy.html
      - .github/workflows/publish-public-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Construct public-site artifact
        run: |
          mkdir -p public-site-artifact
          cp .nojekyll index.html privacy.html public-site-artifact/
      - name: Upload public-site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public-site-artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
